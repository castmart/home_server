services:
  # ── Immich ──────────────────────────────────────────
  # Service layout, image names and digests track the official compose file of
  # the pinned release. Diff against it before every upgrade:
  #   curl -fsSL https://github.com/immich-app/immich/releases/download/v3.3.5/docker-compose.yml
  # See IMMICH_UPGRADE.md for the full procedure.
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      # Do not change the container path: the server reads and writes its media
      # under /data. To move the media, change UPLOAD_LOCATION in .env.
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file: .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  # There is no separate microservices container any more: one immich-server
  # runs both the API and the background workers. `docker compose up -d
  # --remove-orphans` is what clears the old immich_microservices container.

  # ML container is intentionally omitted here — it runs from
  # docker-compose-ml-host.yaml and must be kept on the same IMMICH_VERSION.

  redis:
    container_name: immich_redis
    # Valkey, pinned by digest exactly as upstream pins it. The container is
    # still named immich_redis and the server still speaks the Redis protocol.
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    # VectorChord image, pinned by digest as upstream does. It also ships
    # pgvector and pgvecto.rs, so it can restore older dumps. v3 dropped
    # pgvecto.rs support in the server, so DB_VECTOR_EXTENSION must stay unset.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      # Only applied when the cluster is first initialised.
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment if the database does not live on an SSD.
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${DB_DATA_LOCATION:-./immich/pgdata}:/var/lib/postgresql/data
    restart: always
    shm_size: 128mb
    healthcheck:
      disable: false

  # ── Pi-hole ──────────────────────────────────────────
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - '53:53/tcp'
      - '53:53/udp'
      - '8080:80/tcp'    # admin UI on port 8080 to avoid conflicts
    environment:
      TZ: ${TZ}
      WEBPASSWORD: ${PIHOLE_PASSWORD}
    volumes:
      - './pihole/etc-pihole:/etc/pihole'
      - './pihole/etc-dnsmasq.d:/etc/dnsmasq.d'
    restart: unless-stopped

  # ── Cloudflare Tunnel (remote access V1 — opt-in) ────
  # Only starts when the "cloudflare" profile is active:
  #   COMPOSE_PROFILES=cloudflare in .env, or `--profile cloudflare` on the CLI.
  # V2 runs Tailscale on the host instead and needs no container here.
  # See REMOTE_ACCESS_SETUP.md.
  cloudflared:
    profiles: ["cloudflare"]
    depends_on:
      - immich-server
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    restart: unless-stopped

  # ── Syncthing ────────────────────────────────────────
  # One-shot credential bootstrap. Runs to completion before the daemon
  # starts, so the GUI on :8384 is never reachable without authentication —
  # the image defaults to STGUIADDRESS=0.0.0.0:8384 and Syncthing ships with
  # auth disabled. `generate` is idempotent: it validates and upgrades an
  # existing config and leaves the device certificate and ID untouched.
  syncthing-init:
    container_name: syncthing_init
    image: syncthing/syncthing:${SYNCTHING_VERSION:-latest}
    # Same hostname as the daemon: `generate` writes the device name into
    # config.xml from the hostname of the container it runs in, and the daemon
    # then reads the stored name. Without this the device is named after the
    # bootstrap container's random id.
    hostname: ${SYNCTHING_HOSTNAME:-servidor}
    environment:
      PUID: ${SYNCTHING_PUID:-1000}
      PGID: ${SYNCTHING_PGID:-1000}
    command:
      - generate
      - --home=/var/syncthing/config
      - --gui-user=${SYNCTHING_GUI_USER:?set SYNCTHING_GUI_USER in .env}
      - --gui-password=${SYNCTHING_GUI_PASSWORD:?set SYNCTHING_GUI_PASSWORD in .env}
    volumes:
      - ./syncthing/config:/var/syncthing/config
    restart: 'no'

  syncthing:
    container_name: syncthing
    image: syncthing/syncthing:${SYNCTHING_VERSION:-latest}
    hostname: ${SYNCTHING_HOSTNAME:-servidor}
    depends_on:
      syncthing-init:
        condition: service_completed_successfully
    environment:
      PUID: ${SYNCTHING_PUID:-1000}
      PGID: ${SYNCTHING_PGID:-1000}
      TZ: ${TZ}
    volumes:
      - ./syncthing/config:/var/syncthing/config
      - ${OBSIDIAN_PATH:-/mnt/data/syncthing/obsidian}:/var/syncthing/obsidian
    ports:
      - '8384:8384'          # web GUI (LAN) — credentials enforced by syncthing-init
      - '22000:22000/tcp'    # sync protocol
      - '22000:22000/udp'    # sync protocol (QUIC)
      - '21027:21027/udp'    # local discovery broadcasts
    restart: unless-stopped

  # ── Kavita ────────────────────────────────
  kavita:
    image: jvmilazz0/kavita:latest    # Using the stable branch from the official dockerhub repo.
    container_name: kavita
    volumes:
        - /mnt/data/kavita/manga:/manga
        - /mnt/data/kavita/comics:/comics
        - /mnt/data/kavita/books:/books
        - /mnt/data/kavita/saved/config:/kavita/config     # /kavita/config must not be changed
    environment:
        - TZ=Europe/Berlin
    ports:
        - "5000:5000"
    restart: unless-stopped
